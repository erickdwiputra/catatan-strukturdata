<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Web Struktur Data Lengkap</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- HEADER -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">

        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">

            <div class="flex items-center space-x-3">

                <i class="fa-solid fa-code-branch text-2xl text-indigo-200"></i>

                <h1 class="text-xl font-bold tracking-wide">
                    Struktur Data
                </h1>

            </div>

            <div class="text-sm bg-indigo-700 px-3 py-1 rounded-full text-indigo-100 font-medium">
                Materi 1 - 7 & Tugas
            </div>

        </div>

    </header>


    <div class="max-w-4xl mx-auto px-4 py-8 space-y-6">

        <!-- MATERI 1 -->
        <section class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                <div class="flex items-center space-x-3">

                    <div class="p-2 bg-emerald-50 rounded-lg text-emerald-600">
                        <i class="fa-solid fa-layer-group text-lg"></i>
                    </div>

                    <h2 class="text-lg font-bold text-slate-900">
                        Materi 1
                    </h2>

                </div>

                <select
                onchange="if(this.value) window.location.href=this.value;"
                class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl p-2.5 font-medium outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500 w-full sm:w-72">

                    <option value="" selected disabled>
                        -- Pilih Sub Materi --
                    </option>

                    <option value="strukturdata/Stack,Queue,Deque.html">
                        1.1 - Stack Queue Deques
                    </option>

                    <option value="strukturdata/infix,prefix,posfix.html">
                        1.2 - Infix Prefix Postfix
                    </option>

                </select>

            </div>

        </section>


        <!-- MATERI 2 -->
        <section class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                <div class="flex items-center space-x-3">

                    <div class="p-2 bg-sky-50 rounded-lg text-sky-600">
                        <i class="fa-solid fa-arrow-down-1-9 text-lg"></i>
                    </div>

                    <h2 class="text-lg font-bold text-slate-900">
                        Materi 2
                    </h2>

                </div>

                <select
                onchange="if(this.value) window.location.href=this.value;"
                class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl p-2.5 font-medium outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500 w-full sm:w-72">

                    <option value="" selected disabled>
                        -- Pilih Sub Materi --
                    </option>

                    <option value="strukturdata/bubble.html">
                        2.1 - Bubble Sort
                    </option>

                    <option value="strukturdata/selection.html">
                        2.2 - Selection Sort
                    </option>

                    <option value="strukturdata/insertionsort.html">
                        2.3 - Insertion Sort
                    </option>

                </select>

            </div>

        </section>


        <!-- MATERI 3 -->
        <section class="bg-white rounded-2xl shadow-xs border border-slate-200 p-6">

            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                <div class="flex items-center space-x-3">

                    <div class="p-2 bg-teal-50 rounded-lg text-teal-600">
                        <i class="fa-solid fa-arrows-rotate text-lg"></i>
                    </div>

                    <h2 class="text-lg font-bold text-slate-900">
                        Materi 3
                    </h2>

                </div>

                <select
                onchange="if(this.value) window.location.href=this.value;"
                class="bg-slate-50 border border-slate-300 text-slate-700 text-sm rounded-xl p-2.5 font-medium outline-none cursor-pointer focus:ring-2 focus:ring-indigo-500 w-full sm:w-72">

                    <option value="" selected disabled>
                        -- Pilih Sub Materi --
                    </option>

                    <option value="strukturdata/rekursif.html">
                        3.1 - Rekursif Dasar & Fungsi
                    </option>

                </select>

            </div>

        </section>

    </div>

</body>
</html>
